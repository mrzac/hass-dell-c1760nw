- alias: "Dell C1760nw - Alerte toner faible"
  mode: queued
  trigger:
    - { platform: numeric_state, entity_id: sensor.dell_c1760nw_toner_cyan,    below: 20, id: "20" }
    - { platform: numeric_state, entity_id: sensor.dell_c1760nw_toner_magenta, below: 20, id: "20" }
    - { platform: numeric_state, entity_id: sensor.dell_c1760nw_toner_jaune,  below: 20, id: "20" }
    - { platform: numeric_state, entity_id: sensor.dell_c1760nw_toner_noir,   below: 20, id: "20" }
  action:
    - service: notify.notify
      data:
        title: "🖨️ Niveau de toner faible"
        message: "{{ trigger.to_state.name }} est à {{ trigger.to_state.state }} %."
